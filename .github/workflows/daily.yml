# STAY DRIVEN autopilot (free GitHub Actions)
#
# EKHON DIN E 3TA VIDEO: 1ta long + 2ta reel/short
#
# Bangladesh somoy (UTC+6):
#   4:41 PM  long        (backup 7:41 PM)
#   9:11 PM  quote post
#  10:41 PM  REEL 1      (backup 1:41 AM)
#   4:41 AM  REEL 2      (backup 7:41 AM)
#   6:11 AM  quote post
#
# Kono backup run nijer slot age post hoye gele kichu kore na.
# Reel 1 ar Reel 2 er folder alada, tai ekta arektake muchhe fele na.
name: Stay Driven daily

on:
  schedule:
    - cron: "41 1 * * *"    # BD 7:41 AM   reel 2 backup
    - cron: "41 10 * * *"   # BD 4:41 PM   long main
    - cron: "41 13 * * *"   # BD 7:41 PM   long backup
    - cron: "11 15 * * *"   # BD 9:11 PM   quote post
    - cron: "41 16 * * *"   # BD 10:41 PM  reel 1 main
    - cron: "41 19 * * *"   # BD 1:41 AM   reel 1 backup
    - cron: "41 22 * * *"   # BD 4:41 AM   reel 2 main
    - cron: "11 0 * * *"    # BD 6:11 AM   quote post
  workflow_dispatch:
    inputs:
      kind:
        description: "long / short / post"
        type: choice
        options: [short, long, post]
        default: short
      slot:
        description: "short er jonno: 1 = prothom reel, 2 = ditio reel"
        type: choice
        options: ["1", "2"]
        default: "1"
      dry_run:
        description: "Shudhu video banabe, post korbe na (test)"
        type: boolean
        default: true
      voice_test:
        description: "Voice sample banabe (video na)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: stay-driven
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg (ready-made, fast)
        run: |
          curl -sSL --retry 3 -o ffmpeg.tar.xz \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz"
          mkdir -p ffbin && tar -xf ffmpeg.tar.xz -C ffbin --strip-components=1
          echo "$PWD/ffbin/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Make (and publish) today's video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          SD_TOKEN_URL: ${{ secrets.SD_TOKEN_URL }}
          SD_TOKEN_SECRET: ${{ secrets.SD_TOKEN_SECRET }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              "41 10 * * *") ARGS="--kind long --attempt 1" ;;
              "41 13 * * *") ARGS="--kind long --attempt 2" ;;
              "41 16 * * *") ARGS="--kind short --slot 1 --attempt 1" ;;
              "41 19 * * *") ARGS="--kind short --slot 1 --attempt 2" ;;
              "41 22 * * *") ARGS="--kind short --slot 2 --attempt 1" ;;
              "41 1 * * *")  ARGS="--kind short --slot 2 --attempt 2" ;;
              *)             ARGS="--kind post" ;;
            esac
          else
            if [ "${{ inputs.voice_test }}" = "true" ]; then
              ARGS="--voice-test"
            else
              ARGS="--kind ${{ inputs.kind }}"
              if [ "${{ inputs.kind }}" = "short" ]; then
                ARGS="$ARGS --slot ${{ inputs.slot }}"
              fi
              if [ "${{ inputs.dry_run }}" = "true" ]; then
                ARGS="$ARGS --dry-run"
              fi
            fi
          fi
          echo "Running: python main.py $ARGS"
          python main.py $ARGS

      - name: Keep the files 5 days (download from this page)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stay-driven-${{ github.run_number }}
          path: |
            output/**/*.mp4
            output/**/thumbnail.jpg
            output/**/post.jpg
            output/**/script.json
            output/**/captions.srt
            output/voice-test/*
            !output/**/footage.mp4
          retention-days: 5
          if-no-files-found: ignore

      - name: Save history (no repeated topics or footage)
        if: always()
        run: |
          git config user.name "stay-driven-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/history.json || true
          if ! git diff --cached --quiet; then
            git commit -m "history $(date -u +%F-%H%M)"
            git pull --rebase -X theirs || true
            git push || true
          fi
